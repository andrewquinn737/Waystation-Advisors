<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<title>Inbox — Waystation Advisors</title>
<script>
  (function () {
    var ua = navigator.userAgent || navigator.vendor || "";
    var isMobileUA = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Windows Phone|Mobile/i.test(ua);
    var isIpadOS = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
    document.documentElement.classList.add(isMobileUA || isIpadOS ? "is-mobile-device" : "is-desktop-device");
  })();
</script>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/messages-inbox.css" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
<link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Waystation Advisors" />
<script src="js/pwa.js" defer></script>
<script src="js/noZoom.js" defer></script>
</head>
<body data-page="messages.html">
  <div class="page-loading-overlay" id="pageLoadingOverlay"><div id="pageLoadingTopnav"></div><div class="skeleton-page-content" id="pageLoadingSkeleton"></div></div>
  <script type="module">
    import { skeletonMessagesPage, skeletonTopnavHtml } from "./js/placeholders.js";
    document.getElementById("pageLoadingTopnav").innerHTML = skeletonTopnavHtml();
    document.getElementById("pageLoadingSkeleton").innerHTML = skeletonMessagesPage();
  </script>
  <nav class="topnav" id="topnav"></nav>

  <main>
    <div class="page-header">
      <div class="page-header-left">
        <h1 id="messagesTitle">Inbox</h1>
        <!-- Shown right of the title while a mailbox sync is running (on page
             open, or from "Sync now") — same two-arrows icon as the Sync now
             menu item, spinning until the sync finishes. -->
        <svg class="sync-spinner hidden" id="syncSpinner" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Syncing"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </div>
      <button type="button" class="page-header-settings" id="pageSettingsBtn" title="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>

    <!-- Inbox / Sent switch + one "Mailboxes" button (picker popup below). Shown only when the person has a mailbox
         (js/messages.js setupInboxUi). Spam / Trash / Scheduled, Sync now and Select live in the gear menu. -->
    <div class="mail-toolbar hidden" id="mailToolbar">
      <div class="mail-tabs" role="tablist">
        <button type="button" class="mail-tab active" data-folder="received" role="tab">Inbox</button>
        <button type="button" class="mail-tab" data-folder="sent" role="tab">Sent</button>
      </div>
      <button type="button" class="btn secondary small mail-mailboxes-btn hidden" id="menuMailboxesBtn"><span id="mailboxesBtnLabel">Mailboxes</span></button>
    </div>
    <div class="mail-note hidden" id="mailNote"></div>

    <!-- "Mailboxes" popup — a plain wireAccountsVisiblePopup instance (same
         module Profile/Clients/Dials use for "Accounts visible"), just fed
         one synthetic "account" per connected mailbox (id = email_accounts
         row id, not a profile id) instead of one per person — see
         loadMailboxAccounts() in js/messages.js. Its own storageKey keeps
         this selection independent of every other page's Accounts visible. -->
    <div class="modal-backdrop hidden" id="mailboxesPopup">
      <div class="modal">
        <h2>Mailboxes</h2>
        <p class="help-text">Choose which mailbox(es) to view.</p>
        <div id="mailboxesPopupBody"></div>
        <div class="form-actions">
          <button type="button" class="btn secondary" id="mailboxesPopupClose">Done</button>
        </div>
      </div>
    </div>

    <!-- "Viewing" popup — which folder to show. Received is the synced
         inbox; Sent/Spam/Trash are read live from the real mailbox each time
         (see email-live); Scheduled = emails queued by Mass email plus any
         scheduled folder the mailbox itself has. -->
    <div class="modal-backdrop hidden" id="viewingPopup">
      <div class="modal">
        <h2>Viewing</h2>
        <div class="advanced-settings-list">
          <button type="button" class="advanced-settings-row viewing-option" data-folder="spam"><span class="advanced-settings-row-label">Spam</span><span class="viewing-check">&#10003;</span></button>
          <button type="button" class="advanced-settings-row viewing-option" data-folder="trash"><span class="advanced-settings-row-label">Trash</span><span class="viewing-check">&#10003;</span></button>
          <button type="button" class="advanced-settings-row viewing-option" data-folder="scheduled"><span class="advanced-settings-row-label">Scheduled</span><span class="viewing-check">&#10003;</span></button>
          <button type="button" class="advanced-settings-row viewing-option" data-folder="bounces"><span class="advanced-settings-row-label">Bounces</span><span class="viewing-check">&#10003;</span></button>
        </div>
        <div class="form-actions">
          <button type="button" class="btn secondary" id="viewingPopupClose">Done</button>
        </div>
      </div>
    </div>

    <!-- Settings gear menu — just Notifications now ("Manage mailboxes" was
         a stub that did nothing and has been removed; "Sync now" moved up
         to the triangle menu above). -->
    <div class="page-header-menu hidden" id="settingsMenu">
      <button type="button" class="page-header-menu-item" id="menuSyncNowBtn">
        <span class="menu-item-label">Sync now</span>
      </button>
      <button type="button" class="page-header-menu-item" id="menuFolderBtn">
        <span class="menu-item-label" id="menuFolderLabel">Spam, Trash, Scheduled, Bounces</span>
      </button>
      <button type="button" class="page-header-menu-item" id="menuSelectBtn">
        <span class="menu-item-label">Select</span>
      </button>
    </div>

    <!-- Thread-list select mode bar (see menuSelectBtn above) — same shell/
         behavior as Dials' own select-mode-bar (js/dials.js's enterSelectMode).
         "Unread" (short for "Mark unread" — the full label overflowed the
         pill button's edges on narrower screens, same 4-buttons-in-a-row
         squeeze Dials' own bar avoids by using short labels) and Delete are
         the two bulk actions; tapping a row toggles its selection instead of
         opening it while this is showing. -->
    <div class="select-mode-bar hidden" id="selectModeBar">
      <button type="button" class="select-mode-btn" id="selectBackBtn">Back</button>
      <button type="button" class="select-mode-btn" id="selectAllBtn">Select all</button>
      <button type="button" class="select-mode-btn" id="selectMarkUnreadBtn">Unread</button>
      <button type="button" class="select-mode-btn danger" id="selectDeleteBtn">Delete</button>
    </div>

    <!-- Bulk-delete confirmation for Select mode's Delete button. Deletes the
         selected threads' messages entirely (see js/messages.js) — since
         email-sync's incremental per-mailbox UID watermark never revisits an
         already-seen UID, a deleted message doesn't come back on the next
         sync even though the real email still exists in the mailbox itself. -->
    <div class="modal-backdrop hidden" id="confirmDeleteThreadsModal">
      <div class="modal">
        <h2 id="confirmDeleteThreadsTitle">Delete these conversations?</h2>
        <p class="help-text">This removes them from Messages. It doesn't delete the actual emails from the mailbox, and they won't be re-synced.</p>
        <div class="form-actions">
          <button type="button" class="btn danger" id="confirmDeleteThreadsYesBtn">Delete</button>
          <button type="button" class="btn secondary" id="confirmDeleteThreadsNoBtn">Cancel</button>
        </div>
      </div>
    </div>

    <div id="errorBox" class="error-msg hidden"></div>

    <!-- List view: one row per thread. Detail view (a thread's full message
         list + reply box) replaces this same wrap with a Back button — same
         in-place-swap shape as the Deleted tabs popup, see js/messages.js. -->
    <div id="messagesWrap"></div>
  </main>

  <!-- Compose FAB, bottom-right — opens composeModal for a brand new
       message (no thread/in_reply_to). Hidden for interns (no mailbox to
       send from) and for a team lead/admin with zero connected mailboxes. -->
  <button type="button" class="compose-fab hidden" id="composeFabBtn" title="New email">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- Compose / reply modal — shared by both (see js/messages.js openCompose). -->
  <div class="fullscreen-modal hidden" id="composeModal">
    <div class="fs-header">
      <div class="fs-header-main"><h2 id="composeTitle">New message</h2></div>
      <div class="fs-header-actions">
        <button class="fs-close" id="composeCloseBtn">✕</button>
      </div>
    </div>
    <div class="fs-body">
      <div id="composeError" class="error-msg hidden"></div>
      <div id="composeQuotaNote" class="compose-quota-note hidden"></div>
      <div class="compose-row" id="composeFromRow">
        <label for="composeFromSelect">From</label>
        <select id="composeFromSelect"></select>
      </div>
      <div class="compose-row">
        <label for="composeToInput">To</label>
        <input id="composeToInput" placeholder="name@example.com, another@example.com" />
      </div>
      <div class="compose-row">
        <label for="composeCcInput">Cc</label>
        <input id="composeCcInput" placeholder="Optional" />
      </div>
      <div class="compose-row">
        <label for="composeSubjectInput">Subject</label>
        <input id="composeSubjectInput" />
      </div>
      <!-- Minimal rich-text toolbar (bold/italic/underline/link) over a
           contenteditable body — see wireComposeToolbar in js/messages.js.
           Deliberately not a full third-party editor: this app has no
           build step and avoids pulling in heavy external JS, and this
           covers the actual formatting people use in outreach email. -->
      <div class="compose-toolbar" id="composeToolbar">
        <button type="button" data-cmd="bold" title="Bold"><b>B</b></button>
        <button type="button" data-cmd="italic" title="Italic"><i>I</i></button>
        <button type="button" data-cmd="underline" title="Underline"><u>U</u></button>
        <button type="button" data-cmd="insertUnorderedList" title="Bulleted list">&#8226; List</button>
        <button type="button" data-cmd="createLink" title="Insert link">Link</button>
        <label class="compose-toolbar-attach" title="Attach files">
          Attach
          <input type="file" id="composeAttachInput" multiple hidden />
        </label>
      </div>
      <div id="composeBody" class="compose-body" contenteditable="true"></div>
      <div id="composeAttachmentsList" class="compose-attachments-list"></div>
      <div class="form-actions">
        <button type="button" class="btn" id="composeSendBtn">Send</button>
        <button type="button" class="btn secondary" id="composeCancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/messages.js"></script>
</body>
</html>
