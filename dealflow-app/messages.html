<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="preconnect" href="https://jabjrhkhnbabfihodqie.supabase.co" crossorigin />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<title>Messages — Waystation Advisors</title>
<script>
  (function () {
    var ua = navigator.userAgent || navigator.vendor || "";
    var isMobileUA = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Windows Phone|Mobile/i.test(ua);
    var isIpadOS = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
    document.documentElement.classList.add(isMobileUA || isIpadOS ? "is-mobile-device" : "is-desktop-device");
  })();
</script>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
<link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Waystation Advisors" />
<script src="js/pwa.js" defer></script>
<script src="js/noZoom.js" defer></script>
</head>
<body data-page="messages.html">
  <div class="page-loading-overlay" id="pageLoadingOverlay"><div id="pageLoadingTopnav"></div><div class="skeleton-page-content" id="pageLoadingSkeleton"></div></div>
  <script type="module">
    import { skeletonMessagesPage, skeletonTopnavHtml } from "./js/placeholders.js";
    document.getElementById("pageLoadingTopnav").innerHTML = skeletonTopnavHtml();
    document.getElementById("pageLoadingSkeleton").innerHTML = skeletonMessagesPage();
  </script>
  <nav class="topnav" id="topnav"></nav>

  <main>
    <div class="page-header">
      <div class="page-header-left">
        <!-- Mailbox picker (see js/messages.js) — "All mailboxes" (unified
             inbox, Apple Mail-style) plus one entry per connected mailbox the
             signed-in account can see: their own, for a team lead; every
             connected mailbox, for an admin. Hidden entirely for interns —
             they have no mailbox of their own, so there's nothing to pick;
             their view is always their own clients' matched messages (see
             email_messages' own RLS in supabase migrations). -->
        <button type="button" class="page-header-toggle hidden" id="pageMenuToggle" title="Choose mailbox">
          <svg viewBox="0 0 16 16" width="10" height="10"><path d="M2 10 L8 4 L14 10 Z" fill="currentColor"/></svg>
        </button>
        <h1 id="messagesTitle">Messages</h1>
      </div>
      <button type="button" class="page-header-settings" id="pageSettingsBtn" title="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>

    <!-- Mailbox picker dropdown (opened by pageMenuToggle above). -->
    <div class="page-header-menu hidden" id="pageHeaderMenu" style="right:auto; left:16px;">
      <div id="mailboxMenuList"></div>
    </div>

    <!-- Settings gear menu. "Manage mailboxes" (jumps to Profile's own
         popup for adding/removing up to 3 accounts) is always here; "Sync
         now" too. Refresh/manage are the only two items for an intern. -->
    <div class="page-header-menu hidden" id="settingsMenu">
      <button type="button" class="page-header-menu-item" id="menuSyncNowBtn">
        <span class="menu-item-label">Sync now</span>
        <span class="menu-item-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></span>
      </button>
      <button type="button" class="page-header-menu-item hidden" id="menuManageMailboxesBtn">
        <span class="menu-item-label">Manage mailboxes</span>
        <span class="menu-item-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg></span>
      </button>
      <button type="button" class="page-header-menu-item" id="menuNotificationsBtn">
        <span class="menu-item-label" id="notificationsLabel">Notifications: On</span>
        <span class="menu-item-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/><line class="notif-slash" x1="3" y1="21" x2="21" y2="3"/></svg></span>
      </button>
    </div>

    <div id="errorBox" class="error-msg hidden"></div>

    <!-- List view: one row per thread. Detail view (a thread's full message
         list + reply box) replaces this same wrap with a Back button — same
         in-place-swap shape as the Deleted tabs popup, see js/messages.js. -->
    <div id="messagesWrap"></div>
  </main>

  <!-- Compose FAB, bottom-right — opens composeModal for a brand new
       message (no thread/in_reply_to). Hidden for interns (no mailbox to
       send from) and for a team lead/admin with zero connected mailboxes. -->
  <button type="button" class="compose-fab hidden" id="composeFabBtn" title="New email">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- Compose / reply modal — shared by both (see js/messages.js openCompose). -->
  <div class="fullscreen-modal hidden" id="composeModal">
    <div class="fs-header">
      <div class="fs-header-main"><h2 id="composeTitle">New message</h2></div>
      <div class="fs-header-actions">
        <button class="fs-close" id="composeCloseBtn">✕</button>
      </div>
    </div>
    <div class="fs-body">
      <div id="composeError" class="error-msg hidden"></div>
      <div class="compose-row" id="composeFromRow">
        <label for="composeFromSelect">From</label>
        <select id="composeFromSelect"></select>
      </div>
      <div class="compose-row">
        <label for="composeToInput">To</label>
        <input id="composeToInput" placeholder="name@example.com, another@example.com" />
      </div>
      <div class="compose-row">
        <label for="composeCcInput">Cc</label>
        <input id="composeCcInput" placeholder="Optional" />
      </div>
      <div class="compose-row">
        <label for="composeSubjectInput">Subject</label>
        <input id="composeSubjectInput" />
      </div>
      <!-- Minimal rich-text toolbar (bold/italic/underline/link) over a
           contenteditable body — see wireComposeToolbar in js/messages.js.
           Deliberately not a full third-party editor: this app has no
           build step and avoids pulling in heavy external JS, and this
           covers the actual formatting people use in outreach email. -->
      <div class="compose-toolbar" id="composeToolbar">
        <button type="button" data-cmd="bold" title="Bold"><b>B</b></button>
        <button type="button" data-cmd="italic" title="Italic"><i>I</i></button>
        <button type="button" data-cmd="underline" title="Underline"><u>U</u></button>
        <button type="button" data-cmd="insertUnorderedList" title="Bulleted list">&#8226; List</button>
        <button type="button" data-cmd="createLink" title="Insert link">Link</button>
        <label class="compose-toolbar-attach" title="Attach files">
          Attach
          <input type="file" id="composeAttachInput" multiple hidden />
        </label>
      </div>
      <div id="composeBody" class="compose-body" contenteditable="true"></div>
      <div id="composeAttachmentsList" class="compose-attachments-list"></div>
      <div class="form-actions">
        <button type="button" class="btn" id="composeSendBtn">Send</button>
        <button type="button" class="btn secondary" id="composeCancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/messages.js"></script>
</body>
</html>
